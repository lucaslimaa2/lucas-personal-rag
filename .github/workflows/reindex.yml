name: Reindex Notion → Pinecone (prod)

# Runs daily at 09:00 UTC (06:00 Brasília).
# Also triggerable manually via Actions tab → Run workflow.

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  reindex:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      PINECONE_INDEX_NAME: lucas-rag
      PINECONE_NAMESPACE: prod
      OPENAI_EMBED_MODEL: text-embedding-3-small

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run indexer (prod namespace)
        run: uv run scripts/index_run.py
